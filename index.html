<style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<h1>📚 PDF-Voice</h1>

<p>
Lee y escucha PDFs en varios idiomas
</p>

<p>
Sube un PDF y escúchalo
</p>

<input
type="file"
id="pdf"
accept=".pdf"
>

<br><br>

<button onclick="leerPDF()">
Leer PDF
</button>

<button onclick="pausar()">
Pausar
</button>

<button onclick="continuar()">
Continuar
</button>

<button onclick="parar()">
Parar
</button>

<button onclick="reiniciar()">
Reiniciar libro
</button>

<br><br>

<label>
Velocidad:
</label>

<select id="velocidad">

<option value="0.75">
0.75×
</option>

<option value="1" selected>
1×
</option>

<option value="1.25">
1.25×
</option>

<option value="1.5">
1.5×
</option>

<option value="2">
2×
</option>

</select>

<br><br>

<p id="estado">
Esperando PDF...
</p>

<progress
id="barra"
value="0"
max="100">
</progress>

<p id="porcentaje">
0%
</p>
<br>

<p id="tiempo">
⏳ Calculando...
</p>

<button
id="tema"
onclick="modoOscuro()"
>
🌙 Modo oscuro
</button>
<select id="voz">

<option value="es-ES">
Español 🇪🇸
</option>

<option value="en-US">
English 🇬🇧
</option>

<option value="de-DE">
Deutsch 🇩🇪
</option>

<option value="ru-RU">
Русский 🇷🇺
</option>

<option value="zh-CN">
中文 (Mandarín) 🇨🇳
</option>

<option value="it-IT">
Italiano 🇮🇹
</option>

<option value="fr-FR">
Français 🇫🇷
</option>

</select>
  body{

font-family:
Arial;

background:
#f5f7fb;

text-align:
center;

padding:
40px;

}

h1{

color:
#2563eb;

}

p{

color:
#444;

}

input{

padding:
10px;

margin:
20px;

}

button{

background:
#2563eb;

color:
white;

border:
none;

padding:
12px 20px;

border-radius:
10px;

font-size:
16px;

cursor:
pointer;

}

button:hover{

opacity:
0.9;

}

#estado{

margin-top:
20px;

font-weight:
bold;

}
progress{

width:300px;

height:20px;

}

#porcentaje{

font-size:18px;

font-weight:bold;

}
.oscuro{

background:#121212;

color:white;

}

.oscuro button{

background:#2563eb;

color:white;

}

.oscuro p{

color:#ddd;

}
#tiempo{

font-size:18px;

margin-top:10px;

}
</style>
<script>
  let detenido = false;
let pausado = false;

async function leerPDF(){

detenido = false;

const archivo =
document
.getElementById("pdf")
.files[0];

if(!archivo){

alert(
"Sube un PDF"
);

return;

}

speechSynthesis.cancel();

const buffer =
await archivo.arrayBuffer();

const pdf =
await pdfjsLib
.getDocument({
data:buffer
})
.promise;

let paginaActual =
Number(
localStorage.getItem(
"pagina"
)
)
||
1;

for(
let i=paginaActual;
i<=pdf.numPages;
i++
){

if(
detenido
){

break;

}

localStorage.setItem(
"pagina",
i
);

document
.getElementById(
"estado"
)
.innerText=
"Página "
+
i
+
" de "
+
pdf.numPages
+
" 🔊";

const progreso =
Math.round(
(
i
/
pdf.numPages
)
*
100
);

document
.getElementById(
"barra"
)
.value =
progreso;

document
.getElementById(
"porcentaje"
)
.innerText =
progreso
+
"%";

  const velocidad =
Number(
document
.getElementById(
"velocidad"
)
.value
);

const paginasRestantes =
pdf.numPages
-
i;

const minutos =
Math.ceil(
(
paginasRestantes
*
1.5
)
/
velocidad
);

const horas =
Math.floor(
minutos
/
60
);

const mins =
minutos
%
60;

document
.getElementById(
"tiempo"
)
.innerText =
horas>0
?
"⏳ Quedan ~"
+
horas
+
"h "
+
mins
+
" min"
:
"⏳ Quedan ~"
+
mins
+
" min";
  
const pagina =
await pdf.getPage(i);

const contenido =
await pagina
.getTextContent();

const texto =
contenido.items
.map(
x=>x.str
)
.join(" ");

if(
texto.length<20
){

continue;

}

await new Promise(
resolve=>{

const voz =
new SpeechSynthesisUtterance(
texto
);

voz.lang=
document
.getElementById(
"voz"
)
.value;

voz.rate=
Number(
document
.getElementById(
"velocidad"
)
.value
);

voz.onend=
resolve;

speechSynthesis
.speak(
voz);

});

while(
speechSynthesis.paused
){

await new Promise(
r=>
setTimeout(
r,
300
)
);

}

}

document
.getElementById(
"estado"
)
.innerText=
detenido
?
"Parado ⏹"
:
"Terminado ✅";

}

function pausar(){

speechSynthesis.pause();

document
.getElementById(
"estado"
)
.innerText=
"Pausado ⏸";

}

function continuar(){

speechSynthesis.resume();

const pagina =
localStorage.getItem(
"pagina"
);

const archivo =
document
.getElementById(
"pdf"
)
.files[0];

if(
archivo
){

document
.getElementById(
"estado"
)
.innerText=
"Página "
+
pagina
+
" de 150 🔊";

}else{

document
.getElementById(
"estado"
)
.innerText=
"Reanudado ▶️";

}

}

function parar(){

detenido = true;

speechSynthesis.cancel();

document
.getElementById(
"estado"
)
.innerText=
"Parado ⏹";

document
.getElementById(
"pdf"
).value="";

}

function reiniciar(){

localStorage.removeItem(
"pagina"
);

speechSynthesis.cancel();

document
.getElementById(
"pdf"
).value="";

document
.getElementById(
"barra"
).value=0;

document
.getElementById(
"porcentaje"
)
.innerText=
"0%";

document
.getElementById(
"estado"
)
.innerText=
"Progreso borrado 🗑";

}
function modoOscuro(){

document
.body
.classList
.toggle(
"oscuro"
);

const boton =
document
.getElementById(
"tema"
);

if(
document
.body
.classList
.contains(
"oscuro"
)
){

boton
.innerText=
"☀️ Modo claro";

}else{

boton
.innerText=
"🌙 Modo oscuro";

}

}
</script>
